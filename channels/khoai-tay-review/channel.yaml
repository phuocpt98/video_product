  license: Giấy phép chuẩn của YouTube
  comments: Giữ lại bình luận có thể không phù hợp để xem xét
  tags: [khoai tây review, nghe truyện, truyện audio, truyện full, truyện đô thị, truyện hệ thống, truyện trọng sinh, truyện làm giàu, truyện vả mặt]
  description: |
    <Tóm tắt 2–3 câu: nhân vật chính bị khinh ra sao, bước ngoặt gì, lật kèo tới đâu – KHÔNG spoil kết.>

    📖 Truyện: <Tên truyện> | Thể loại: <đô thị / hệ thống / trọng sinh>

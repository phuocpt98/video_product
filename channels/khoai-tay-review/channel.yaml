# Kênh Khoai Tây Review. Nguồn đúng về thương hiệu kênh; kế hoạch ở docs/plans/channel.md
name: Khoai Tây Review
handle: "@khoaitayreview"   # chưa xác nhận còn trống trên YouTube và TikTok
color: "#F29B36"
brand:
  avatar: brand/avatar_1024.png
  mascot_reference: brand/avatar_master.png
  banner: brand/banner_2560x1440.png   # 2560x1440, chữ nằm trong vùng an toàn 1546x423
  font: assets/fonts/BeVietnamPro-*.ttf  # OFL, dùng thương mại được
schedule: "1-2 video/ngày, 19h-22h"
tiktok_bio: "Nghe truyện drama, đô thị, trọng sinh 🥔 Full mỗi trưa 12h trên YouTube"   # ≤ 80 ký tự; Người sáng lập chọn 28/9/2026 (giữ đúng giờ đăng 12h)
tts:   # Người sáng lập chọn ngày 26/9/2026
  engine: vieneu-v3-turbo   # chạy local, Apache-2.0
  voice: Ngọc Huyền         # mặc định (nữ, Bắc, đọc tự nhiên)
  voice_backup: Trúc Ly
  speed: 1.34               # tăng tốc bằng ffmpeg atempo; Người sáng lập chốt 28/9: nhanh thêm 20% so với 1.12 (26/9)

visual_style: "simple rustic chibi cartoon, big round head about one third of the body height, NO neck (the head sits directly on the shoulders), small simple body, thick uniform black outlines, flat solid colors, no shading, no highlights, minimal details, simple cute faces, early-2000s Chinese TV cartoon / Flash animation look, simple flat background, no 3D, no photorealism, no gradients"   # Người sáng lập chốt 27/9/2026: chibi mộc mạc, đầu to, không cổ

keywords:   # YouTube Studio > Cài đặt > Kênh > Từ khoá (giới hạn khoảng 500 ký tự)
  - khoai tây review
  - nghe truyện
  - truyện audio
  - truyện full
  - truyện đô thị
  - truyện hệ thống
  - truyện trọng sinh
  - trọng sinh làm giàu
  - truyện làm giàu
  - truyện vả mặt
  - truyện lật kèo
  - truyện nghịch tập
  - truyện quan trường
  - truyện đô thị hệ thống
  - truyện audio full
  - nghe truyện đêm khuya
  - review truyện
  - truyen audio
  - nghe truyen
  - truyen do thi

description: |
  🥔 Khoai Tây Review – nơi kể lại những bộ truyện đô thị, hệ thống, trọng sinh làm giàu cuốn nhất, theo cách dễ nghe nhất.

  Bị coi thường, bị phản bội, bị dồn tới đường cùng… rồi lật kèo ngoạn mục. Nếu bạn mê cảm giác "vả mặt" sảng khoái, thích nghe nhân vật chính từ tay trắng đi lên đỉnh cao, thì đây là chỗ dành cho bạn.

  📚 Ở kênh có gì:
  • Truyện FULL dài, nghe liền một mạch, có mốc chương để tua nhanh
  • Truyện đô thị, hệ thống, trọng sinh, làm giàu, quan trường
  • Mỗi tối một truyện mới, khung giờ 19h–22h

  🎧 Nghe lúc làm việc, lái xe, tập thể dục hay trước khi ngủ đều hợp.

  ✍️ Kịch bản được Khoai Tây biên tập và kể lại theo phong cách riêng, có thêm lời bình của người kể, không đọc nguyên văn bản gốc. Kênh sử dụng giọng đọc AI và hình ảnh do kênh tự tạo.

  👉 Bấm Đăng ký và bật chuông 🔔 để không bỏ lỡ truyện mới.
  💬 Muốn nghe truyện gì? Để lại tên truyện ở phần bình luận nhé!

  📩 Liên hệ công việc, bản quyền: <email>

# YouTube Studio > Cài đặt > Mặc định tải lên. Pipeline (channel-manager) sẽ tự điền thay chỗ <...>

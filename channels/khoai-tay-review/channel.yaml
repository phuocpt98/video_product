# Hashtag. YouTube: tối đa 15 cái/video (quá 15 thì YouTube bỏ qua TẤT CẢ), 3 cái đầu hiện trên tiêu đề
hashtags:
  youtube_top3: ["#nghetruyen", "#truyenaudio", "#khoaitayreview"]
  youtube_common: ["#truyenfull", "#reviewtruyen", "#truyenhay", "#nghetruyendemkhuya"]
  youtube_by_genre:   # chọn 1 nhóm theo truyện, tổng cộng không quá 15
    do_thi: ["#truyendothi", "#dothi", "#truyenvamat", "#latkeo"]
    he_thong: ["#truyenhethong", "#hethong", "#truyenvamat"]
    trong_sinh: ["#truyentrongsinh", "#trongsinh", "#trongsinhlamgiau"]
    lam_giau: ["#truyenlamgiau", "#lamgiau", "#nghichtap"]
    quan_truong: ["#truyenquantruong", "#quantruong"]
  tiktok_max: 5   # TikTok tối đa 5 hashtag/video (Người sáng lập chốt 28/9/2026): lấy nhóm thể loại trước, rồi tiktok_common theo thứ tự
  tiktok_common: ["#khoaitayreview", "#nghetruyen", "#truyenaudio", "#reviewtruyen", "#truyenhay", "#xuhuong"]
  tiktok_by_genre:
    do_thi: ["#truyendothi", "#vamat"]
    he_thong: ["#truyenhethong"]
    trong_sinh: ["#trongsinh"]
    drama: ["#truyendrama", "#vamat", "#truyenngan"]

# Danh sách phát. Tạo sẵn các danh sách "core"; danh sách theo truyện chỉ tạo khi truyện có từ 2 phần trở lên
playlists:
  core:
    - title: "Truyện FULL | Nghe Liền Một Mạch"
      description: "Tổng hợp truyện FULL của Khoai Tây Review: đô thị, hệ thống, trọng sinh làm giàu. Nghe liền một mạch, có mốc chương để tua. Truyện mới mỗi tối 19h–22h. #truyenfull #nghetruyen #khoaitayreview"
    - title: "Truyện Đô Thị Vả Mặt | Lật Kèo Cực Gắt"
      description: "Bị coi thường, bị phản bội, rồi lật kèo ngoạn mục. Tuyển tập truyện đô thị vả mặt sảng khoái nhất do Khoai Tây kể lại. #truyendothi #truyenvamat #latkeo"
    - title: "Truyện Hệ Thống | Kích Hoạt Là Đổi Đời"
      description: "Nhân vật chính kích hoạt hệ thống, từ tay trắng lên đỉnh cao. Tuyển tập truyện hệ thống hay nhất. #truyenhethong #hethong #nghetruyen"
    - title: "Truyện Trọng Sinh Làm Giàu | Làm Lại Cuộc Đời"
      description: "Trọng sinh về quá khứ, biết trước tương lai, làm giàu và báo thù. Tuyển tập truyện trọng sinh làm giàu cuốn nhất. #truyentrongsinh #trongsinhlamgiau #lamgiau"
    - title: "Nghe Truyện Đêm Khuya | Dễ Ngủ, Dễ Nghe"
      description: "Truyện dài, giọng kể đều, hợp nghe trước khi ngủ, lúc lái xe hay làm việc. #nghetruyendemkhuya #truyenaudio #khoaitayreview"
  later:   # tạo khi có nội dung
    - title: "Truyện Quan Trường | Leo Lên Đỉnh Quyền Lực"   # khi thử ngách phụ
    - title: "Tập Mở Đầu | Nghe Thử Truyện Mới"             # các bản P1 làm mồi
  per_story_template:
    title: "<Tên truyện> | Trọn Bộ Theo Thứ Tự"
    description: "Nghe <Tên truyện> theo đúng thứ tự từ phần 1. <Tóm tắt 1 câu>. Khoai Tây Review kể lại, truyện mới mỗi tối 19h–22h."

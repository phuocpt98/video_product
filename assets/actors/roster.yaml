# priority: 1 = cần cho truyện mẫu (tập 1), 2 = mô-típ đô thị rất hay gặp, 3 = làm sau.
# look/outfits viết tiếng Anh để đưa thẳng vào prompt; phong cách chung lấy từ channel.yaml → visual_style.

